name: Production build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-24.04
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: fde_ci
          POSTGRES_PASSWORD: fde_ci_test_only
          POSTGRES_DB: fde_ci_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fde_ci -d fde_ci_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create dependency lock if registry access was unavailable during development
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install --package-lock-only
      - run: npm ci
      - name: Test registration data persistence and simultaneous check-ins in isolated PostgreSQL
        env:
          FDE_REGISTRATION_DATABASE_URL: postgresql://fde_ci:fde_ci_test_only@127.0.0.1:5432/fde_ci_test
          FDE_SESSION_SECRET: github-actions-only-registration-test-key-2026
        run: |
          npm run setup-registration-db
          node --import tsx --test tests/registration-db.test.ts
      - name: Compare Impeccable detection with the production source
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p qa-design
          git worktree add --detach /tmp/four-dogs-before "$(git merge-base HEAD origin/main)"
          set +e
          (cd /tmp/four-dogs-before && npx --yes impeccable@4.8.0 detect src/ --json) > qa-design/impeccable-before.json 2> qa-design/impeccable-before.log
          echo "$?" > qa-design/impeccable-before-status.txt
          npx --yes impeccable@4.8.0 detect src/ --json > qa-design/impeccable-after.json 2> qa-design/impeccable-after.log
          echo "$?" > qa-design/impeccable-after-status.txt
          set -e
          echo "Impeccable source detection exit statuses (0 clean, 2 findings, 1 runtime error):"
          cat qa-design/impeccable-before-status.txt qa-design/impeccable-after-status.txt
      - run: npm run build
      - run: npm run qa
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install headless browser for responsive QA
        run: |
          python -m pip install playwright==1.56.0
          python -m playwright install --with-deps chromium
      - name: Test desktop, tablet, iPhone, reduced-motion and no-JS experiences
        run: |
          if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
            PR_NUMBER="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["number"])')"
            export FOUR_DOGS_QA_URL="https://deploy-preview-${PR_NUMBER}--4dogsentertainment.netlify.app"
            export FOUR_DOGS_DESIGN_AFTER_URL="$FOUR_DOGS_QA_URL"
            # Wait for the deploy-preview alias to serve the matching editorial page.
            for check in $(seq 1 40); do
              if curl --max-time 8 -fsSL "$FOUR_DOGS_QA_URL/services/" | grep -q "Good nights, weddings"; then
                break
              fi
              sleep 3
            done
            python scripts/qa-premium-browser.py
            python scripts/qa-design-comparison.py
            python scripts/qa-registration-browser.py
          else
            npm run dev -- --host 127.0.0.1 --port 4321 > /tmp/four-dogs-astro.log 2>&1 &
            python scripts/qa-premium-browser.py
            python scripts/qa-registration-browser.py
          fi
      - name: Compare rendered Impeccable findings on production and deploy preview
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p qa-design
          PR_NUMBER="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["number"])')"
          export CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          set +e
          for page in home services weddings for-the-brides; do
            if [ "$page" = "home" ]; then route="/"; else route="/$page/"; fi
            npx --yes impeccable@4.8.0 detect --json "https://4dogsentertainment.com$route" > "qa-design/impeccable-rendered-before-$page.json" 2> "qa-design/impeccable-rendered-before-$page.log"
            echo "$?" > "qa-design/impeccable-rendered-before-$page-status.txt"
            npx --yes impeccable@4.8.0 detect --json "https://deploy-preview-${PR_NUMBER}--4dogsentertainment.netlify.app$route" > "qa-design/impeccable-rendered-after-$page.json" 2> "qa-design/impeccable-rendered-after-$page.log"
            echo "$?" > "qa-design/impeccable-rendered-after-$page-status.txt"
          done
          set -e
          echo "Impeccable rendered-page exit statuses. Findings are preserved in artifacts:"
          for report in qa-design/impeccable-rendered-*-status.txt; do echo "$report: $(cat "$report")"; done
      - name: Compare production and preview mobile Lighthouse scores
        if: github.event_name == 'pull_request'
        continue-on-error: true
        run: |
          mkdir -p qa-design
          PR_NUMBER="$(python -c 'import json,os; print(json.load(open(os.environ["GITHUB_EVENT_PATH"]))["number"])')"
          export CHROME_PATH="$(find "$HOME/.cache/ms-playwright" -type f -path '*/chrome-linux64/chrome' -print -quit)"
          npx --yes lighthouse@12 https://4dogsentertainment.com/ --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa-design/lighthouse-before-home-mobile.json --quiet
          npx --yes lighthouse@12 "https://deploy-preview-${PR_NUMBER}--4dogsentertainment.netlify.app/" --chrome-flags="--headless --no-sandbox" --only-categories=performance,accessibility,best-practices,seo --output=json --output-path=qa-design/lighthouse-after-home-mobile.json --quiet
          python - <<'PY'
          import json
          for version in ('before', 'after'):
              with open(f'qa-design/lighthouse-{version}-home-mobile.json') as file:
                  audit = json.load(file)
              print(version, {key: int(info['score']*100) for key, info in audit['categories'].items()})
          PY
      - name: Keep screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: four-dogs-responsive-smoke-screenshots
          path: |
            qa-screenshots/*.png
            qa-design/*
          if-no-files-found: ignore

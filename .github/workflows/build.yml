name: Production build
on:
  pull_request:
  push:
    branches: [main]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Create dependency lock if registry access was unavailable during development
        if: ${{ hashFiles('package-lock.json') == '' }}
        run: npm install --package-lock-only
      - run: npm ci
      - run: npm run build
      - run: npm run qa
